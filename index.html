<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Test de oposición</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%231f6f6b%27/%3E%3Cpath d=%27M9 17l4.5 4.5L23 11%27 stroke=%27white%27 stroke-width=%273.2%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --surface:#fffdf9; --surface-2:#f0ebe3; --ink:#1f2a2e; --muted:#5f6b6f; --line:#e2dbd0;
  --accent:#1f6f6b; --accent-ink:#ffffff; --accent-soft:#dcece9;
  --ok:#2e7d4f; --ok-soft:#e1f1e6; --bad:#b4483c; --bad-soft:#f7e3df; --warn:#a86a12;
  --radius:16px; --shadow:0 1px 2px rgba(31,42,46,.06),0 6px 24px rgba(31,42,46,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141a1c; --surface:#1c2427; --surface-2:#232d31; --ink:#e9eeec; --muted:#9aa8a6; --line:#2e3a3e;
    --accent:#5cbdb4; --accent-ink:#0f1a1a; --accent-soft:#1f3634;
    --ok:#6cc792; --ok-soft:#1d3327; --bad:#ec8d80; --bad-soft:#3a2321; --warn:#e3a94d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#141a1c; --surface:#1c2427; --surface-2:#232d31; --ink:#e9eeec; --muted:#9aa8a6; --line:#2e3a3e;
  --accent:#5cbdb4; --accent-ink:#0f1a1a; --accent-soft:#1f3634;
  --ok:#6cc792; --ok-soft:#1d3327; --bad:#ec8d80; --bad-soft:#3a2321; --warn:#e3a94d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:650;letter-spacing:-.01em;margin:0}
button{font:inherit;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;background:none;border:0;padding:0}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:Fraunces,serif;font-weight:650}
.brand b{font-family:Fraunces,serif;font-size:1.15rem;font-weight:650}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.hero h1{font-size:clamp(1.8rem,5vw,2.5rem);line-height:1.15;margin-bottom:8px}
.hero p{margin:0 0 24px;color:var(--muted)}
.cards{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.choice{text-align:left;display:flex;flex-direction:column;gap:10px;color:inherit;transition:transform .15s,border-color .15s}
.choice:hover{transform:translateY(-2px);border-color:var(--accent)}
.choice h2{font-size:1.35rem}
.choice .tag{align-self:flex-start;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.section-title{margin:36px 0 12px;font-size:1.1rem}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.hist li>span:first-child{min-width:0}
.hist li:last-child{border-bottom:0}
.pill{font-weight:600;border-radius:999px;padding:2px 10px;font-size:.82rem;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
/* configuración */
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:14px 0 6px}
.tema{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;text-align:center;color:var(--ink);line-height:1.15}
.tema b{display:block;font-size:1rem}
.tema span{font-size:.7rem;color:var(--muted)}
.tema[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tema[aria-pressed="true"] span{color:var(--accent-ink);opacity:.85}
.field{display:flex;flex-direction:column;gap:6px;margin-top:18px}
.field label{font-weight:600}
.num{display:flex;align-items:center;gap:8px}
.num input{width:96px;font:inherit;font-weight:600;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.num button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.2rem}
/* test */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -16px 20px;padding:12px 16px}
.bar .inner{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.clock{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:600}
.clock svg{width:16px;height:16px}
.clock.over{color:var(--bad)}
.progress{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.q .head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.q .n{flex:none;min-width:32px;height:32px;padding:0 6px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:.9rem}
.q .stem{font-weight:500}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);line-height:1.45}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt .l{flex:none;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:.85rem;background:var(--surface-2)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .l{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.good .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.q.res-ok{border-left:5px solid var(--ok)}
.q.res-bad{border-left:5px solid var(--bad)}
.q.res-blank{border-left:5px solid var(--line)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:.78rem;color:var(--muted)}
.reserva-sep{display:flex;align-items:center;gap:12px;margin:28px 0 14px;color:var(--muted);font-weight:600;font-size:.9rem}
.reserva-sep:before,.reserva-sep:after{content:"";flex:1;height:1px;background:var(--line)}
/* resultado */
.score{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:640px){.score{grid-template-columns:auto 1fr;align-items:center}}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:0 auto;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-2) 0)}
.ring>div{width:118px;height:118px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.ring b{font-family:Fraunces,serif;font-size:2rem;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem}
.bytema{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:10px}
.bytema div{background:var(--surface-2);border-radius:10px;padding:6px 8px;font-size:.82rem;display:flex;justify-content:space-between}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 14px}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:.88rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:.9rem;margin:12px 0}
.center{text-align:center}
.hidden{display:none!important}
@media (max-width:520px){header.top:has(#quien .chip) .brand b{display:none}header.top{margin-bottom:18px}.bar{padding:10px 16px;margin-bottom:14px}.bar .inner{gap:8px}.q{padding:14px}.q .head{gap:10px}.hero h1{margin-bottom:4px}}
.avatar{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--av);color:#fff;font-weight:600;font-size:.85rem;flex:none}
.avatar.big{width:64px;height:64px;font-size:1.6rem;font-family:Fraunces,serif}
.avatar.plus{background:var(--surface-2);color:var(--muted);border:2px dashed var(--line)}
.chip{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.perfiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;max-width:640px;margin:8px auto 0}
.perfil{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);color:var(--ink);transition:transform .15s,border-color .15s}
.perfil:hover{transform:translateY(-2px);border-color:var(--accent)}
.perfil b{font-size:1.05rem}
.nuevo{max-width:420px;margin:18px auto 0}
.nombre{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.pinwrap{display:grid;place-items:center;min-height:60vh}
.pinbox{width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.pinbox h2{margin-top:10px;font-size:1.4rem}
.dots{display:flex;gap:14px;margin:18px 0 20px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);transition:background .12s,border-color .12s}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.key{height:60px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:1.4rem;font-weight:600}
.key:hover{border-color:var(--accent)}
.key:active{transform:scale(.96)}
.link{background:none;border:0;padding:4px 0;color:var(--muted);font-size:.88rem;text-decoration:underline;text-underline-offset:3px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tablero{margin:0 0 20px;overflow-x:auto}
.tablero h3{font-size:1.1rem}
.tablero table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.92rem}
.tablero th{font-size:.72rem;font-weight:600;color:var(--muted);text-align:right;padding:0 6px 8px;text-transform:uppercase;letter-spacing:.04em}
.tablero th:first-child{text-align:left}
.tablero td{padding:10px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.tablero td:first-child{text-align:left}
.tablero tr.yo td{background:var(--accent-soft)}
.tablero tr.yo td:first-child{border-radius:10px 0 0 10px}
.tablero tr.yo td:last-child{border-radius:0 10px 10px 0}
.tablero td.top{color:var(--accent)}
.medalla{margin-left:4px;font-size:.95rem}
@media (max-width:520px){.tablero th{font-size:.62rem;letter-spacing:0}.tablero td{padding:9px 4px;font-size:.85rem}.tablero .chip{gap:6px}.medalla{margin-left:2px}}
.espera{max-width:420px;margin:12vh auto 0;text-align:center}
.espera h3{font-size:1.25rem;margin-bottom:6px}
.barra{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden;margin:18px 0 12px;position:relative}
.barra i{position:absolute;inset:0 auto 0 0;width:0;border-radius:8px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));animation:avanza var(--dur,18s) cubic-bezier(.1,.6,.3,1) forwards}
.barra i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:brillo 1.4s linear infinite}
.barra.fina{height:5px;margin:4px 0 0;width:100%}
.mensaje{min-height:1.5em;transition:opacity .3s}
@keyframes avanza{to{width:94%}}
@keyframes brillo{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.barra i{animation-duration:.01s}.barra i:after{animation:none}}
.modal{position:fixed;inset:0;z-index:20;background:rgba(15,20,22,.45);display:grid;place-items:center;padding:16px}
.modal .card{max-width:440px;width:100%}
.modal h3{font-size:1.2rem;margin-bottom:6px}
.choice.reto{border-style:dashed}
@media (min-width:640px){.cards .choice.reto{grid-column:1 / -1}}
.retos:empty{display:none}
.retos{display:grid;gap:12px;margin-bottom:16px}
.invitacion{border-color:var(--accent);background:var(--accent-soft)}
.perfiles.izq{justify-content:start;max-width:none;margin:12px 0 0;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.perfil.mini{padding:14px 8px}
.perfil.mini .avatar.big{width:48px;height:48px;font-size:1.2rem}
.perfil[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent) inset}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg{border:0;background:var(--surface);color:var(--ink);padding:9px 16px;font-weight:600}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sala{display:grid;gap:8px}
.fila-sala{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.cuenta-capa{background:color-mix(in srgb,var(--bg) 92%,transparent)}
.cuenta{font-family:Fraunces,serif;font-size:7rem;font-weight:650;color:var(--accent);line-height:1}
.avance{display:grid;gap:8px;margin-bottom:14px;padding:12px 14px}
.fila-avance{display:grid;grid-template-columns:minmax(90px,auto) 1fr auto;gap:10px;align-items:center}
.mini{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.mini i{display:block;height:100%;border-radius:8px;transition:width .4s}
.puesto{display:inline-block;min-width:1.6em}
.origenes{margin-top:28px;overflow-x:auto}
.origenes h3{font-size:1.1rem;margin-bottom:10px}
.origenes table{width:100%;border-collapse:collapse;font-size:.9rem}
.origenes td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
.origenes td:nth-child(2),.origenes td:nth-child(3){text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.origenes tr.grupo td{font-weight:600;background:var(--surface-2)}
.origenes td.fuente{padding-left:18px;color:var(--muted)}
.origenes tr.total td{font-weight:700;border-top:2px solid var(--ink)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
footer{margin-top:48px;font-size:.8rem;color:var(--muted);text-align:center}
</style>

<body>
<div class="wrap" id="app">
  <header class="top">
    <button class="brand" id="home" aria-label="Inicio"><span class="logo">A2</span><b>Test de oposición</b></button>
    <div id="quien"></div>
  </header>
  <main id="view"><p class="muted">Cargando preguntas…</p></main>
  <footer id="pie"></footer>
</div>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
<script>
"use strict";
let DATA = null;
const view = document.getElementById("view");
// Almacén común: Cloudflare Workers + D1 (servidor/). Guarda usuarias, PIN, resultados y el
// tablero. Este navegador solo guarda una copia y el test a medias.
const API_REAL = "https://test-oposicion.fermentolactico.workers.dev/";
const API = (["127.0.0.1", "localhost"].includes(location.hostname) && new URLSearchParams(location.search).get("api")) || API_REAL;
let usuario = null, clave = null, USUARIAS = [], TABLERO = [];
// Perfil de pruebas: no sale en el tablero ni entre las tarjetas; se entra con …/test-oposicion/?prueba
const PRUEBA = "Prueba", VER_PRUEBA = new URLSearchParams(location.search).has("prueba");
const K = {
  get actual() { return `oposicion.${usuario}.actual`; },
  get historial() { return `oposicion.${usuario}.historial`; },
  get usadas() { return `oposicion.${usuario}.usadas`; },
  get pendientes() { return `oposicion.${usuario}.pendientes`; },
};
// El servidor responde en ~0,15 s, pero la red del móvil puede fallar: cada intento se corta a los
// 12 s y se reintenta. Repetir es seguro porque el servidor no guarda dos veces el mismo resultado
// y el resto de acciones no duplican nada.
async function pedir(url, opciones) {
  let ultimo;
  for (let intento = 0; intento < 4; intento++) {
    if (intento) await new Promise(r => setTimeout(r, 500 * intento));
    const corte = new AbortController(), reloj = setTimeout(() => corte.abort(), 12000);
    try {
      const j = await (await fetch(url, { ...opciones, signal: corte.signal })).json();
      if (!j.ok) throw Object.assign(new Error(j.error || "Error del servidor."), { delServidor: true });
      if (j.tablero) TABLERO = j.tablero.filter(t => t.nombre !== PRUEBA);
      return j;
    } catch (err) {
      if (err.delServidor) throw err;          // PIN incorrecto, bloqueo…: no se reintenta
      ultimo = err;
    } finally { clearTimeout(reloj); }
  }
  throw new Error("Sin conexión con el servidor.");
}
const api = datos => pedir(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(datos) });
// La web arranca con lo último que guardó este aparato y se actualiza cuando llega la respuesta,
// así una red lenta no deja la pantalla en blanco.
async function cargarEstado() {
  // solo lectura: si tarda más de 4 s, se lanza otra petición en paralelo y vale la primera que llegue
  const j = await new Promise((ok, ko) => {
    let fallos = 0, hecho = false;
    const lanzar = () => pedir(API + "?accion=estado").then(r => { if (!hecho) { hecho = true; ok(r); } }, e => { if (++fallos === 2) ko(e); });
    lanzar();
    setTimeout(() => { if (!hecho) lanzar(); else fallos++; }, 4000);
  });
  guardar("oposicion.estado", { usuarias: j.usuarias, tablero: j.tablero });
  USUARIAS = j.usuarias.filter(u => u.nombre !== PRUEBA || VER_PRUEBA);
}
function estadoGuardado() {
  const e = leer("oposicion.estado", null);
  if (!e) return false;
  USUARIAS = e.usuarias.filter(u => u.nombre !== PRUEBA || VER_PRUEBA);
  TABLERO = e.tablero.filter(t => t.nombre !== PRUEBA);
  return true;
}
// Identificador corto y estable de cada pregunta (para no repetirlas entre simulacros)
const corto = t => { let h = 0x811c9dc5; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36); };

// ---------- almacenamiento del navegador (puede fallar: modo privado) ----------
function leer(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } }
function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function borrar(k) { try { localStorage.removeItem(k); } catch {} }

// ---------- utilidades ----------
const el = (tag, attrs = {}, ...hijos) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const h of hijos.flat(Infinity)) if (h !== null && h !== undefined && h !== false) e.append(h instanceof Node ? h : document.createTextNode(String(h)));
  return e;
};
function icono(trazos) {   // SVG de línea, hereda el color del texto
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "2"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("aria-hidden", "true");
  s.innerHTML = trazos; return s;
}
const coma = (x, d = 2) => x.toFixed(d).replace(".", ",");
const barajar = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fecha = ms => new Date(ms).toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" }) + " · " + new Date(ms).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
const reloj = s => { const m = Math.floor(Math.abs(s) / 60), ss = Math.abs(s) % 60; return (s < 0 ? "−" : "") + (m >= 60 ? Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0") : m) + ":" + String(ss).padStart(2, "0"); };
const temasTxt = ts => !ts ? "Todo el temario (11-70)" : (ts.length === 1 ? "Tema " : "Temas ") + rangos(ts);
function rangos(ts) {
  const s = [...ts].sort((a, b) => a - b), out = [];
  for (let i = 0; i < s.length; i++) { let j = i; while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++; out.push(j > i + 1 ? s[i] + "-" + s[j] : j === i + 1 ? s[i] + ", " + s[j] : String(s[i])); i = j; }

}

// ---------- elegir preguntas: las mismas reglas que examen.py del tutor ----------
// Simulacro: el peso de cada tema lo da examen.py (_tribunal): preguntas oficiales, las de gestión A2
// doble, las repetidas otra vez y los temas nuevos de 2026 al menos como un tema medio.
// Dentro de cada tema, primero las oficiales repetidas por el tribunal, luego el resto de
// oficiales del IB-Salut, las oficiales de otras administraciones (x), las de academia y las
// generadas; cada tema sale tanto como en los exámenes oficiales (+1).
// Test de estudio: al azar y por turnos entre los temas elegidos.
function elegir(temas, cuantas, simulacro, excluir) {
  const porTema = {};
  DATA.preguntas.forEach((p, i) => {
    if (excluir && excluir.has(p.h)) return;
    if (temas && !temas.includes(p.t)) return;
    (porTema[p.t] ||= []).push(i);
  });
  for (const t in porTema) {
    barajar(porTema[t]);
    if (simulacro) porTema[t].sort((a, b) => {
      const A = DATA.preguntas[a], B = DATA.preguntas[b];
      return (B.r - A.r) || (B.of - A.of) || (!!A.x - !!B.x) || (A.g - B.g);
    });
  }
  const elegidas = [];
  while (elegidas.length < cuantas) {
    const ts = Object.keys(porTema).filter(t => porTema[t].length);
    if (!ts.length) break;
    if (simulacro) {
      const w = ts.map(t => (DATA.pesos[t] || 0) + 1), tot = w.reduce((a, b) => a + b, 0);
      let x = Math.random() * tot, k = 0;
      while (x >= w[k]) x -= w[k++];
      elegidas.push(porTema[ts[k]].shift());
    } else {
      for (const t of barajar(ts)) if (elegidas.length < cuantas) elegidas.push(porTema[t].shift());
    }
  }
  return elegidas;
}

function crear(tipo, temas, n) {
  const R = DATA.reglas, sim = tipo === "simulacro";
  let reserva = 0, aviso = "";
  if (sim) { n = R.preguntas; reserva = R.reserva; temas = null; }
  let usadas = new Set(sim ? leer(K.usadas, []) : []);
  let elegidas = elegir(temas, n + reserva, sim, usadas);
  if (sim && elegidas.length < n + reserva) {          // ya se han usado casi todas: se empieza de cero
    borrar(K.usadas); usadas = new Set();
    elegidas = elegir(temas, n + reserva, sim, usadas);
    aviso = "Ya habías hecho simulacros con casi todo el banco: las preguntas vuelven a empezar.";
  }
  if (!elegidas.length) return null;
  if (elegidas.length < n + reserva) { aviso = `Solo hay ${elegidas.length} preguntas de esos temas (pediste ${n}).`; n = elegidas.length; }
  const principales = elegidas.slice(0, n).sort((a, b) => DATA.preguntas[a].t - DATA.preguntas[b].t);
  const maximo = sim ? R.maximo : 10, minimo = sim ? R.minimo : 5;
  const ex = {
    tipo, temas, n, reserva, maximo, minimo, aviso,
    minutos: sim ? R.minutos : Math.max(1, Math.round(R.minutos * n / (R.preguntas + R.reserva))),
    preguntas: principales.concat(elegidas.slice(n)), marcas: {}, inicio: Date.now(), corregido: null, usuario,
  };
  return ex;
}

// Tiempo empleado frente al del examen: «1:48:10 de 2:30:00» o «2:35:23, 5:23 de más»
function tiempoTxt(ex) {
  const usado = Math.round((ex.corregido.fin - ex.inicio) / 1000), limite = ex.minutos * 60;
  return usado > limite ? `${reloj(usado)}, ${reloj(usado - limite)} de más` : `${reloj(usado)} de ${reloj(limite)}`;
}

// Un acierto vale máximo/n; un error resta la cuarta parte de un acierto; en blanco, 0 (BOIB 72/2026, 9.2.2.b).
// Las de reserva no puntúan.
function puntuar(ex) {
  const acierto = ex.maximo / ex.n, error = -acierto / 4;
  let a = 0, e = 0, b = 0; const porTema = {}, reserva = [0, 0];
  ex.preguntas.forEach((qi, k) => {
    const p = DATA.preguntas[qi], m = ex.marcas[k], bien = m === p.c;
    if (k >= ex.n) { reserva[1]++; if (bien) reserva[0]++; return; }
    const t = (porTema[p.t] ||= [0, 0]); t[1]++;
    if (m === undefined) b++; else if (bien) { a++; t[0]++; } else e++;
  });
  const nota = Math.round(Math.max(0, a * acierto + e * error) * 100) / 100;
  return { a, e, b, nota, aprobado: nota >= ex.minimo, porTema, reserva, fin: Date.now() };
}

  setTimeout(vuelta, 0);              // primero se pinta la pantalla, luego se pregunta
  return () => { parado = true; };
}

  const caja = el("div", { class: "card" }, lista, nota, botones);

  const ESTADOS = { aceptada: ["Dentro", "ok"], invitada: ["Esperando respuesta", ""], rechazada: ["No viene", "bad"], sin_respuesta: ["No contestó", "bad"] };
  const pintarSala = r => {

      botones.replaceChildren(
        el("button", { class: "btn primary", disabled: dentro < 2, onclick: async ev => { ev.target.disabled = true; try { const j = await api({ accion: "empezarReto", nombre: usuario, clave, id: r.id }); arrancar(j.reto); } catch (e) { nota.textContent = e.message; ev.target.disabled = false; } } }, "Empezar ahora"),
        el("button", { class: "btn danger", onclick: async () => { await api({ accion: "cancelarReto", nombre: usuario, clave, id: r.id }).catch(() => {}); inicio(); } }, "Cancelar el reto"));

  doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.text(sub, M, 23);

}

  }

}
const lh = pt => pt * 0.3528 * 1.38;
function salto(ctx, alto) {
  if (ctx.y + alto > ctx.H - 18) { ctx.doc.addPage(); ctx.y = 18; return true; }
  return false;
}

  doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(...PDFC.accent);

}
function subtitulo(ex) {
  return `${temasTxt(ex.temas)} · ${ex.n} preguntas${ex.reserva ? ` + ${ex.reserva} de reserva` : ""} · ${ex.minutos} minutos · ${new Date(ex.inicio).toLocaleDateString("es-ES")}`;
}
function nombreFichero(ex, que) {
  const d = new Date(ex.inicio), f = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}-${String(d.getHours()).padStart(2, "0")}${String(d.getMinutes()).padStart(2, "0")}`;
  return `${ex.tipo === "simulacro" ? "simulacro" : "test"}-${f}-${que}.pdf`;
}

function pdfTest(ex) {
  const ctx = nuevoPdf(ex.tipo === "simulacro" ? "Simulacro de examen" : "Test de estudio", subtitulo(ex));
  const { doc, W, M } = ctx, ancho = W - 2 * M;
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...PDFC.muted);
  const instr = doc.splitTextToSize(`Una sola respuesta correcta por pregunta. Acierto: ${coma(ex.maximo / ex.n, 3)} puntos; un error resta la cuarta parte de un acierto; en blanco, 0. Nota de 0 a ${ex.maximo}; se supera con ${ex.minimo}.` + (ex.reserva ? " Las preguntas de reserva se contestan, pero solo cuentan si se anula alguna." : ""), ancho);
  doc.text(instr, M, ctx.y); ctx.y += instr.length * lh(9) + 6;
  ex.preguntas.forEach((qi, k) => {
    const p = DATA.preguntas[qi];
    if (k === ex.n && ex.reserva) separador(ctx, `Preguntas de reserva (${ex.n + 1}-${ex.n + ex.reserva})`);
    doc.setFont("helvetica", "bold"); doc.setFontSize(10.5);
    const stem = doc.splitTextToSize(p.e, ancho - 12);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    const ops = p.o.map(o => doc.splitTextToSize(o, ancho - 22));
    const alto = stem.length * lh(10.5) + ops.reduce((s, o) => s + Math.max(o.length * lh(10), 6) + 2.2, 0) + 7;
    salto(ctx, Math.min(alto, ctx.H - 40));
    // número
    doc.setFillColor(...PDFC.accent); doc.roundedRect(M, ctx.y - 4.6, 9, 6.6, 1.6, 1.6, "F");
    doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(9);
    doc.text(String(k + 1), M + 4.5, ctx.y, { align: "center" });
    // enunciado
    doc.setTextColor(...PDFC.ink); doc.setFontSize(10.5);
    doc.text(stem, M + 12, ctx.y); ctx.y += stem.length * lh(10.5) + 1.8;
    // opciones
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    ops.forEach((o, j) => {
      const h = Math.max(o.length * lh(10), 6);
      if (salto(ctx, h + 2)) {}
      doc.setDrawColor(...PDFC.line); doc.setFillColor(...PDFC.paper); doc.setLineWidth(.3);
      doc.roundedRect(M + 12, ctx.y - 3.9, 5.6, 5.6, 1.2, 1.2, "FD");
      doc.setTextColor(...PDFC.accent); doc.setFont("helvetica", "bold"); doc.text("abcd"[j], M + 14.8, ctx.y, { align: "center" });
      doc.setTextColor(...PDFC.ink); doc.setFont("helvetica", "normal"); doc.text(o, M + 21, ctx.y);
      ctx.y += h + 2.2;
    });
    ctx.y += 4;
  });
  cerrarPdf(ctx, nombreFichero(ex, "preguntas"));
}

function pdfRespuestas(ex) {
  const r = ex.corregido;
  const ctx = nuevoPdf("Respuestas · " + (ex.tipo === "simulacro" ? "Simulacro de examen" : "Test de estudio"), (ex.usuario && r ? ex.usuario + " · " : "") + subtitulo(ex));
  const { doc, W, M } = ctx, ancho = W - 2 * M;
  if (r) {
    doc.setFillColor(...(r.aprobado ? PDFC.okSoft : PDFC.badSoft)); doc.roundedRect(M, ctx.y, ancho, 18, 3, 3, "F");
    doc.setTextColor(...(r.aprobado ? PDFC.ok : PDFC.bad)); doc.setFont("helvetica", "bold"); doc.setFontSize(16);
    doc.text(`${coma(r.nota)} / ${ex.maximo}`, M + 6, ctx.y + 11.5);
    doc.setFontSize(10); doc.setTextColor(...PDFC.ink); doc.setFont("helvetica", "normal");
    doc.text(`${r.aprobado ? "Superado" : "No superado"} (se supera con ${ex.minimo})   ·   ${r.a} aciertos · ${r.e} errores · ${r.b} en blanco` + (r.reserva[1] ? `   ·   reserva ${r.reserva[0]}/${r.reserva[1]}` : ""), M + 44, ctx.y + 10.8);
    ctx.y += 24;
    const pasado = (r.fin - ex.inicio) / 1000 > ex.minutos * 60;
    doc.setFontSize(9.5); doc.setTextColor(...(pasado ? PDFC.bad : PDFC.ink));
    doc.text("Tiempo: " + tiempoTxt(ex), M, ctx.y); ctx.y += 6;
    doc.setFontSize(8.5); doc.setTextColor(...PDFC.muted);
    doc.text("En cada casilla: la respuesta correcta y, debajo, la que marcaste. Verde, acierto; rojo, error; gris, en blanco.", M, ctx.y); ctx.y += 7;
  }
  const cols = 5, gap = 3, cw = (ancho - gap * (cols - 1)) / cols, ch = r ? 13 : 10;
  const bloque = (desde, hasta, titulo) => {
    if (titulo) separador(ctx, titulo);
    for (let k = desde; k < hasta; k++) {
      const i = k - desde, col = i % cols;
      if (col === 0 && i > 0) ctx.y += ch + gap;
      if (col === 0) salto(ctx, ch + 2);
      const x = M + col * (cw + gap), p = DATA.preguntas[ex.preguntas[k]], m = ex.marcas[k];
      const est = !r ? "n" : m === undefined ? "blank" : m === p.c ? "ok" : "bad";
      doc.setFillColor(...(est === "ok" ? PDFC.okSoft : est === "bad" ? PDFC.badSoft : est === "blank" ? [240, 235, 227] : PDFC.soft));
      doc.roundedRect(x, ctx.y, cw, ch, 2, 2, "F");
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...PDFC.muted);
      doc.text(String(k + 1), x + 3, ctx.y + 5.2);
      doc.setFontSize(7); doc.text("T" + p.t, x + 3, ctx.y + (r ? 10.5 : 8.3));
      doc.setFont("helvetica", "bold"); doc.setFontSize(14);
      doc.setTextColor(...(est === "ok" ? PDFC.ok : est === "bad" ? PDFC.bad : PDFC.accent));
      doc.text("abcd"[p.c], x + cw - 4, ctx.y + 6.4, { align: "right" });
      if (r) {
        doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(...PDFC.muted);
        doc.text(m === undefined ? "en blanco" : "tú: " + "abcd"[m], x + cw - 4, ctx.y + 10.8, { align: "right" });
      }
    }
    ctx.y += ch + gap + 4;
  };
  bloque(0, ex.n, null);
  if (ex.reserva) bloque(ex.n, ex.n + ex.reserva, `Preguntas de reserva (${ex.n + 1}-${ex.n + ex.reserva}) · no puntúan`);
  cerrarPdf(ctx, nombreFichero(ex, "respuestas"));
}

// ---------- arranque ----------
document.getElementById("home").addEventListener("click", () => { if (DATA) usuario ? inicio() : entrada(); });   // un test a medias queda guardado
// ---------- entrada: quién eres y su PIN ----------
// El PIN se comprueba en el servidor (Apps Script), que bloquea tras 5 fallos. La web solo
// manda su resumen SHA-256. No es seguridad bancaria: basta para que nadie toque notas ajenas.
const COLORES = ["#1f6f6b", "#8a4f9e", "#b5642c", "#3d6bb3", "#a8414f", "#4f7d2f", "#7a6a1f"];
const nombres = () => USUARIAS.map(u => u.nombre);
const colorDe = u => { const i = nombres().indexOf(u); return COLORES[(i < 0 ? 0 : i) % COLORES.length]; };
function sesion(v) {
  try {
    if (v === undefined) return JSON.parse(sessionStorage.getItem("oposicion.sesion") || "null");
    v ? sessionStorage.setItem("oposicion.sesion", JSON.stringify(v)) : sessionStorage.removeItem("oposicion.sesion");
  } catch { return null; }
}
async function resumen(u, pin) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("oposicion:" + u + ":" + pin));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
// Espera con barra de progreso y mensajes que van cambiando (Google puede tardar ~15 s)
const MENSAJES = ["Conectando con el servidor…", "Barajando las preguntas…", "Consultando al tribunal…", "Afilando el lápiz…",
  "Repasando el BOIB…", "Ordenando la clasificación…", "Calentando motores…", "Casi listo…"];
function barraEspera(fina) {
  const barra = el("div", { class: "barra" + (fina ? " fina" : "") }, el("i"));
  return barra;
}
function mensajesRotando(nodo, inicio = 0, activo = () => true) {   // se para sola cuando activo() es falso
  let i = inicio;
  const cambiar = () => {
    if (!nodo.isConnected || !activo()) { nodo.style.opacity = 1; return clearInterval(t); }
    nodo.style.opacity = 0;
    setTimeout(() => { if (activo()) nodo.textContent = MENSAJES[++i % MENSAJES.length]; nodo.style.opacity = 1; }, 300);
  };
  const t = setInterval(cambiar, 2600);
  nodo.textContent = MENSAJES[i];
  return nodo;
}
function pantallaEspera() {
  return el("div", { class: "espera" },
    el("h3", {}, "Preparando tus tests"),
    barraEspera(),
    mensajesRotando(el("p", { class: "muted small mensaje" })),
    null);
}
function avatar(u, grande) { return el("span", { class: "avatar" + (grande ? " big" : ""), style: `--av:${colorDe(u)}` }, u.slice(0, 1).toUpperCase()); }

function pintarCabecera() {
  document.getElementById("quien").replaceChildren(usuario ? el("div", { class: "row", style: "gap:8px" },
    el("span", { class: "chip" }, avatar(usuario), usuario),
    el("button", { class: "btn small", onclick: salir }, "Salir")) : "");
}
function salir() { pararReloj(); usuario = clave = null; sesion(null); pintarCabecera(); entrada(); }
function entrar(u, c, datos) {
  usuario = u; clave = c; sesion({ u, c });
  if (datos) sincronizar(datos);
  pintarCabecera(); abrirUsuario(); enviarPendientes();
}
function sincronizar(datos) {   // lo del servidor manda; lo pendiente de enviar se conserva
  const pend = leer(K.pendientes, []);
  guardar(K.historial, [...pend.slice().reverse(), ...datos.historial].sort((a, b) => b.fin - a.fin).slice(0, 50));
  guardar(K.usadas, [...new Set([...datos.usadas, ...leer(K.usadas, [])])]);
}
// Al volver con la sesión abierta se entra al momento con lo guardado, y detrás se trae del
// servidor lo hecho en otros aparatos (y se comprueba que el PIN sigue valiendo).
function sincronizarDetras() {
  const u = usuario;
  api({ accion: "entrar", nombre: u, clave }).then(datos => {
    if (usuario !== u) return;
    sincronizar(datos);
    if (view.querySelector(".hero h1")?.textContent === "Practica como en el examen") inicio();
  }, err => { if (usuario === u && /PIN/.test(err.message)) salir(); });
}
function abrirUsuario() {
  if (!DATA || !usuario) return;
  const a = leer(K.actual, null);
  if (a && a.corregido) resultado(a); else inicio();
}
let enviando = false;
async function enviarPendientes() {
  if (enviando || !usuario) return;
  const pend = leer(K.pendientes, []);
  if (!pend.length) return;
  enviando = true;
  try {
    for (const r of pend) {
      await api({ accion: "guardar", nombre: usuario, clave, resultado: r, usadas: leer(K.usadas, []) });
      guardar(K.pendientes, leer(K.pendientes, []).filter(x => x.fin !== r.fin));
    }
    refrescarTablero();
  } catch { /* sin conexión: se reintenta en la próxima ocasión */ }
  enviando = false;
}

// ---------- tablero ----------
const tableros = new Set();
function refrescarTablero() { for (const t of [...tableros]) { if (!t.isConnected) { tableros.delete(t); continue; } t.replaceWith(vistaTablero()); } }
function vistaTablero() {
  const filas = TABLERO.filter(t => t.total > 0 || t.nombre === usuario);
  const caja = el("section", { class: "card tablero" });
  tableros.add(caja);
  const lider = campo => { const v = filas.map(f => f[campo]).filter(x => x !== null && x > 0); return v.length ? Math.max(...v) : null; };
  const L = { mejor: lider("mejor"), media5: lider("media5"), semana: lider("semana") };
  const celda = (f, campo, txt) => el("td", { class: f[campo] !== null && f[campo] === L[campo] ? "top" : "" },
    f[campo] === null ? el("span", { class: "muted" }, "—") : txt, f[campo] !== null && f[campo] === L[campo] ? el("span", { class: "medalla", title: "Líder" }, "🥇") : null);
  caja.append(...[
    el("h3", {}, "Clasificación"),
    filas.length ? el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, ""), el("th", {}, "Mejor"), el("th", {}, "Media"), el("th", {}, "Semana"))),
      el("tbody", {}, filas
        .sort((a, b) => (b.media5 ?? -1) - (a.media5 ?? -1) || (b.semana - a.semana))
        .map(f => el("tr", { class: f.nombre === usuario ? "yo" : "" },
          el("td", {}, el("span", { class: "chip" }, avatar(f.nombre), f.nombre)),
          celda(f, "mejor", coma(f.mejor ?? 0)),
          celda(f, "media5", coma(f.media5 ?? 0)),
          celda(f, "semana", String(f.semana)))))) :
      el("p", { class: "muted small" }, "Todavía no hay resultados. ¡El primer simulacro abre la clasificación!"),
    filas.length ? el("p", { class: "muted small", style: "margin:10px 0 0" }, "Mejor: su mejor simulacro · Media: sus 5 últimos simulacros (sobre 30) · Semana: tests y simulacros hechos desde el lunes.") : null
  ].filter(Boolean));   // append() escribiría «null» como texto
  return caja;
}

function entrada() {
  pararReloj();
  const nuevo = el("input", { class: "nombre", placeholder: "Nombre", maxlength: "30", "aria-label": "Nombre" });
  const avisoNuevo = el("p", { class: "muted small" });
  const formNuevo = el("div", { class: "card nuevo hidden" },
    el("b", {}, "Nueva persona"),
    el("div", { class: "row", style: "margin-top:10px" }, nuevo,
      el("button", { class: "btn primary", onclick: async ev => {
        const n = nuevo.value.trim().replace(/\s+/g, " ").slice(0, 30);
        if (!n) return;
        ev.target.disabled = true;
        try { await api({ accion: "nueva", nombre: n }); await cargarEstado(); pedirPin(n); }
        catch (err) { avisoNuevo.textContent = err.message; ev.target.disabled = false; }
      } }, "Continuar")), avisoNuevo);
  const quedanHuecos = USUARIAS.filter(u => u.nombre !== PRUEBA).length < 5;
  pintar(
    el("section", { class: "hero center" }, el("h1", {}, "¿Quién eres?"), el("p", {}, "Cada una tiene sus resultados y su PIN, desde cualquier aparato.")),
    el("div", { class: "perfiles" },
      USUARIAS.map(u => el("button", { class: "perfil", onclick: () => pedirPin(u.nombre) }, avatar(u.nombre, true), el("b", {}, u.nombre),
        el("span", { class: "muted small" }, u.tienePin ? "Con PIN" : "Primera vez"))),
      quedanHuecos ? el("button", { class: "perfil add", onclick: () => { formNuevo.classList.remove("hidden"); nuevo.focus(); } },
        el("span", { class: "avatar big plus" }, "+"), el("b", {}, "Añadir"), el("span", { class: "muted small" }, "otra persona")) : null),
    formNuevo,
    el("div", { style: "margin-top:28px" }, vistaTablero()),
    vistaOrigenes()
  );
}

function pedirPin(u) {
  const tiene = (USUARIAS.find(x => x.nombre === u) || {}).tienePin;
  let fase = tiene ? "entrar" : "crear", primero = "", pin = "", ocupado = false;
  const titulo = el("h2", {}), ayuda = el("p", { class: "muted small", style: "margin:6px 0 0;min-height:1.4em" });
  const puntos = el("div", { class: "dots" }, [0, 1, 2, 3].map(() => el("i")));
  const espera = el("div", { style: "width:100%;max-width:220px;min-height:9px" });
  const caja = el("div", { class: "card pinbox" });
  const textos = () => {
    titulo.textContent = fase === "entrar" ? `Hola, ${u}` : fase === "crear" ? `Crea tu PIN, ${u}` : "Repite el PIN";
    espera.replaceChildren(...(ocupado ? [barraEspera(true)] : []));
    if (!ayuda.dataset.error && !ocupado) ayuda.textContent = fase === "entrar" ? "Escribe tu PIN de 4 cifras." : fase === "crear" ? "Elige 4 cifras. Te lo pediremos al entrar." : "Para comprobar que no hay errores.";
    puntos.querySelectorAll("i").forEach((d, k) => d.classList.toggle("on", k < pin.length));
  };
  const error = msg => {
    ayuda.dataset.error = "1"; ayuda.textContent = msg; ayuda.style.color = "var(--bad)";
    caja.classList.remove("shake"); void caja.offsetWidth; caja.classList.add("shake");
    setTimeout(() => { delete ayuda.dataset.error; ayuda.style.color = ""; textos(); }, 2200);
  };
  const completo = async () => {
    if (fase === "crear") { primero = pin; pin = ""; fase = "repetir"; return textos(); }
    if (fase === "repetir" && pin !== primero) { pin = ""; primero = ""; fase = "crear"; return error("No coinciden. Vuelve a empezar."); }
    ocupado = true; textos(); mensajesRotando(ayuda, 0, () => ocupado); ayuda.textContent = "Comprobando el PIN…";
    try {
      const c = await resumen(u, pin);
      let datos;
      try { datos = await api({ accion: fase === "entrar" ? "entrar" : "crearPin", nombre: u, clave: c }); }
      catch (err) {
        // un reintento de crear el PIN puede llegar cuando el primero ya lo guardó: se entra con él
        if (fase === "repetir" && /ya tiene PIN/.test(err.message)) datos = await api({ accion: "entrar", nombre: u, clave: c });
        else throw err;
      }
      const yo = USUARIAS.find(x => x.nombre === u); if (yo) yo.tienePin = true;
      entrar(u, c, datos);
    } catch (err) {
      ocupado = false; pin = "";
      if (fase === "repetir") { fase = "crear"; primero = ""; }
      error(err.message);
    }
  };
  const pulsar = d => {
    if (ocupado) return;
    if (d === "⌫") pin = pin.slice(0, -1);
    else if (pin.length < 4) pin += d;
    textos();
    if (pin.length === 4) setTimeout(completo, 120);
  };
  const teclado = el("div", { class: "pad" }, ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"].map(d =>
    d ? el("button", { class: "key", "aria-label": d === "⌫" ? "Borrar" : d, onclick: () => pulsar(d) }, d) : el("span")));
  const teclas = e => { if (!caja.isConnected) return document.removeEventListener("keydown", teclas);
    if (/^[0-9]$/.test(e.key)) pulsar(e.key); else if (e.key === "Backspace") pulsar("⌫"); else if (e.key === "Escape") entrada(); };
  document.addEventListener("keydown", teclas);
  const olvido = el("button", { class: "link" }, "¿Has olvidado el PIN?");
  olvido.addEventListener("click", () => { olvido.replaceWith(el("span", { class: "muted small" }, "Pídele a Nadal que te lo reinicie.")); });
  caja.append(avatar(u, true), titulo, ayuda, espera, puntos, teclado,
    el("div", { class: "row", style: "justify-content:space-between;margin-top:14px" },
      el("button", { class: "link", onclick: entrada }, "← Volver"), tiene ? olvido : el("span")));
  pintar(el("div", { class: "pinwrap" }, caja));
  textos();
}

const estadoListo = cargarEstado();          // a la vez que las preguntas, no después
const sinConexion = () => view.replaceChildren(el("div", { class: "card center" }, el("h3", {}, "No se puede conectar"),
  el("p", { class: "muted" }, "El servidor de resultados no responde. Revisa la conexión y recarga la página.")));
fetch("preguntas.json", { cache: "no-cache" }).then(r => r.json()).then(d => {
  DATA = d;
  document.getElementById("pie").textContent = `${d.preguntas.length.toLocaleString("es-ES")} preguntas · Reglas de puntuación: ${d.reglas.cita}.`;
  d.preguntas.forEach(p => p.h = corto(p.id));
  const arrancar = desdeGuardado => {
    const ses = sesion();
    if (ses && nombres().includes(ses.u)) { entrar(ses.u, ses.c); if (desdeGuardado) sincronizarDetras(); }
    else entrada();
  };
  if (estadoGuardado()) {
    arrancar(true);
    estadoListo.then(() => {
      // en la entrada se repinta (salvo si está escribiendo un nombre nuevo); dentro, solo el tablero
      if (view.querySelector(".perfiles") && view.querySelector(".nuevo.hidden")) entrada(); else refrescarTablero();
    }, () => {});
  } else {
    view.replaceChildren(pantallaEspera());
    return estadoListo.then(() => arrancar(false), sinConexion);
  }
}).catch(() => { view.replaceChildren(el("p", {}, "No se han podido cargar las preguntas. Recarga la página.")); });
</script>
